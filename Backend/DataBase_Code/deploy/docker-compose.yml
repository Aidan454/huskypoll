# Example: two copies of HuskyPoll (frontend + backend each) on one server,
# at /cse1010 and /test-version1, behind nginx (see nginx-huskypoll.conf).
# Start from this folder with:  docker compose up -d --build
services:
  cse1010:
    build:
      context: ../..                                  # repository root (frontend/ + database_code/)
      dockerfile: database_code/deploy/Dockerfile.fullstack
    image: huskypoll
    restart: unless-stopped
    environment:
      HUSKYPOLL_SITE_URL: https://huskypoll.cse.uconn.edu/cse1010
      HUSKYPOLL_SECRET_KEY: change-me-to-a-long-random-string   # python -c "import secrets; print(secrets.token_urlsafe(32))"
      HUSKYPOLL_SECURE_COOKIES: "1"
      # HUSKYPOLL_ADMIN_NETIDS: abc12345
    volumes:
      - cse1010-data:/data
    ports:
      - "127.0.0.1:8001:8000"   # only nginx on this machine can reach it

  test-version1:
    image: huskypoll           # same image, different address and data
    restart: unless-stopped
    depends_on: [cse1010]
    environment:
      HUSKYPOLL_SITE_URL: https://huskypoll.cse.uconn.edu/test-version1
      HUSKYPOLL_SECRET_KEY: a-different-long-random-string
      HUSKYPOLL_SECURE_COOKIES: "1"
      HUSKYPOLL_DEV_LOGIN: "1"   # test copy only - never on a real course
    volumes:
      - test1-data:/data
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  cse1010-data:
  test1-data:
