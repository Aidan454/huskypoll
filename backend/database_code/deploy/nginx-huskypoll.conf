# Example nginx config for HuskyPoll copies under sub-paths of one domain.
# Each container serves both the web pages and the API (at <path>/api), and
# its HUSKYPOLL_SITE_URL must match its location below.
# Both styles work: passing the prefix through (as here) or stripping it
# (proxy_pass http://127.0.0.1:8001/;  - note the trailing slash).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name huskypoll.cse.uconn.edu;
    # ssl_certificate / ssl_certificate_key ...

    client_max_body_size 12m;   # image uploads are limited to 10 MB by the app

    location /cse1010/ {
        proxy_pass http://127.0.0.1:8001;              # keeps the /cse1010 prefix
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;        # WebSockets (live updates)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;                         # keep idle WebSockets open
    }

    location /test-version1/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
