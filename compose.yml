# Local development: copy the environment file once, then `docker compose up -d --build`.
#   cp .env.example .env
#
#   Frontend (Vite):  http://localhost:5173
#   Backend API:      http://localhost:8000/api      (docs: http://localhost:8000/api/docs)
#
# All configuration lives in the root .env file (see .env.example for every option).
# The browser loads the frontend from :5173, and the frontend's code calls the API
# at http://localhost:8000/api (with credentials: "include" so the login cookie is
# sent). Those calls come from the browser, so they use localhost, not the
# service name "backend".
services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    volumes:
      - ./backend/data:/data                           # database + uploaded images (kept between runs)
      - ./backend/database_code:/app                   # live code: edits reload the server
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy                     # start once the API is answering
