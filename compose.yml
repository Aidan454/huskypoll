# Local development: `docker compose up -d --build` from the repo root.
#   Frontend (Vite):  http://localhost:5173
#   Backend API:      http://localhost:8000/api      (docs: http://localhost:8000/api/docs)
#
# The browser loads the frontend from :5173, and the frontend's code calls the API
# at http://localhost:8000/api (with credentials: "include" so the login cookie is
# sent). Those calls come from the browser, so they use localhost, not the
# service name "backend".
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      HUSKYPOLL_DEV_LOGIN: "1"                         # dev-only login (POST /api/auth/dev-login)
      HUSKYPOLL_FRONTEND_URL: http://localhost:5173    # allow the frontend to call the API (CORS) + join/QR links
      HUSKYPOLL_SITE_URL: http://localhost:8000        # API lives at SITE_URL/api
      HUSKYPOLL_DB: /data/huskypoll.db
      HUSKYPOLL_MEDIA_DIR: /data/media
      HUSKYPOLL_SECRET_KEY: dev-only-not-a-secret      # fixed so logins survive reloads (dev only!)
      WATCHFILES_FORCE_POLLING: "true"                 # code reload works with Windows/Mac file mounts
    volumes:
      - ./backend/data:/data                           # database + uploaded images (kept between runs)
      - ./backend:/code                                # live code: edits reload the server
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE: http://localhost:8000/api         # where the frontend's code should send API calls
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app                                # live code: edits hot-reload like `npm run dev`
      - /app/node_modules                              # keep the container's Linux dependencies
    depends_on:
      backend:
        condition: service_healthy                     # start once the API is answering
